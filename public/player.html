<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Player — Nova</title>
		<script>
			try {
				var c = JSON.parse(localStorage.getItem("nova:cloak") || "null");
				if (c && c.title) document.title = c.title;
			} catch (e) {}
		</script>
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="stylesheet" href="/css/theme.css" />
	</head>

	<body class="player-body">
		<div class="player-bar">
			<div class="side">
				<button class="icon-btn" id="pl-back" title="Back to games">
					<svg viewBox="0 0 24 24">
						<path
							d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"
						/>
					</svg>
				</button>
				<button class="icon-btn" id="pl-home" title="Home">
					<svg viewBox="0 0 24 24">
						<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
					</svg>
				</button>
			</div>
			<span class="title" id="pl-title">Loading…</span>
			<div class="side right">
				<button class="icon-btn" id="pl-reload" title="Reload tab">
					<svg viewBox="0 0 24 24">
						<path
							d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6a6 6 0 0 1 4.24 1.76L13 11h7V4z"
						/>
					</svg>
				</button>
				<button class="icon-btn" id="pl-fullscreen" title="Fullscreen">
					<svg viewBox="0 0 24 24">
						<path
							d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
						/>
					</svg>
				</button>
				<button
					class="icon-btn"
					id="pl-blank"
					title="Open tab in about:blank window"
				>
					<svg viewBox="0 0 24 24">
						<path
							d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2zM14 3v2h3.59l-7.83 7.83 1.41 1.41L19 6.41V10h2V3z"
						/>
					</svg>
				</button>
			</div>
		</div>
		<div class="tabs-bar" id="tabs-bar">
			<div
				style="
					display: flex;
					align-items: center;
					gap: 6px;
					flex: 1;
					overflow-x: auto;
					scrollbar-width: none;
				"
				id="tabs-list"
			></div>
			<form class="tab-add-form" id="tab-add-form">
				<input
					id="tab-add-input"
					type="text"
					placeholder="+ Add a site to a new tab…"
					autocomplete="off"
					spellcheck="false"
				/>
				<button class="btn" type="submit">Open</button>
			</form>
		</div>
		<div style="position: relative; flex: 1">
			<div class="loading-screen" id="pl-loading">
				<div class="ring"></div>
				<p>Connecting through the tunnel…</p>
			</div>
			<div id="frames" style="position: absolute; inset: 0"></div>
		</div>

		<script src="/js/data.js"></script>
		<script src="/baremux/index.js"></script>
		<script src="/uv/uv.bundle.js"></script>
		<script src="/uv/uv.config.js"></script>
		<script src="/register-sw.js"></script>
		<script src="/search.js"></script>
		<script src="/js/shared.js"></script>
		<script src="/js/player.js"></script>
	</body>
</html>
