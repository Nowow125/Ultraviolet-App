<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<title>AI — Nova</title>
		<script>
			try {
				var c = JSON.parse(localStorage.getItem("nova:cloak") || "null");
				if (c && c.title) document.title = c.title;
			} catch (e) {}
		</script>
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="stylesheet" href="/css/theme.css" />
	</head>

	<body>
		<header class="topbar" data-page="ai"></header>

		<main class="wrap">
			<section class="section" style="padding-bottom: 8px">
				<h1
					style="
						font-family: var(--display);
						font-size: clamp(28px, 4.5vw, 40px);
						margin: 10px 0 4px;
					"
				>
					Nova AI
				</h1>
				<p style="color: var(--muted); margin: 0 0 18px; font-size: 14.5px">
					Your personal assistant. It can launch games, cloak tabs, do math,
					roll dice and chat — fully offline. Connect an API key in
					<a href="/settings.html#ai" style="color: var(--accent)">Settings</a>
					to upgrade it to a real LLM.
				</p>
				<div class="ai-layout">
					<div class="ai-main">
						<div class="chat-head">
							<strong>🤖 Nova Assistant</strong>
							<span class="ai-status" id="ai-status">LOCAL BRAIN</span>
							<span class="badge-local">PRIVATE · ON-DEVICE</span>
						</div>
						<div class="messages" id="ai-messages"></div>
						<div class="ai-suggest" id="ai-suggest"></div>
						<div class="chat-input-row">
							<input
								id="ai-input"
								type="text"
								placeholder="Ask anything, or try “play smash karts”…"
								maxlength="1000"
								autocomplete="off"
							/>
							<button class="btn primary" id="ai-send">Send</button>
						</div>
					</div>
				</div>
			</section>
		</main>

		<footer>
			<div class="links">
				<a href="/about.html">About</a>
				<a href="/settings.html">Settings</a>
				<a
					href="https://github.com/titaniumnetwork-dev/Ultraviolet-App"
					target="_blank"
					rel="noreferrer"
					>Ultraviolet</a
				>
				<a href="/credits.html">Credits</a>
			</div>
			<div><span>Nova &copy; 2026 — built on Ultraviolet</span></div>
		</footer>

		<script src="/js/data.js"></script>
		<script src="/config.js"></script>
		<script src="/js/shared.js"></script>
		<script src="/js/ai.js"></script>
	</body>
</html>
